<!DOCTYPE html>
<html>
<head>
    <title>iPhone Plug - Redirecting to Payment...</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'store/img/iphone-plug-logo.png' %}">
</head>
<body>
    <h3>Redirecting to secure payment...</h3>
    <p>Please wait, do not refresh.</p>

    <!-- PayFast Form -->
    <div style="display:none;">
        {{ payment_form|safe }}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.forms[0].submit();
        });
    </script>
</body>
</html>
